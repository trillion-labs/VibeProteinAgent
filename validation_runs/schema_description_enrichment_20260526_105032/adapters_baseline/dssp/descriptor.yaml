name: dssp
version: "1.0.0"
category: misc
description: "Assigns per-residue secondary structure (helix, sheet, turn, etc.) from a PDB or mmCIF structure. CPU-only and fast; use for structural annotation before analysis, ranking, or visualization."
runtime: python
backend: binary
gpu_required: false
gpus_required: 1
startup_cost: low
estimated_runtime_s: 30
warm_load_capable: true
pin_warm: true
support_status: verified
support_status_reason: null
availability_probe: "vibeproteinagent.adapters.dssp:availability_skip_reason"
supported_tasks: [secondary_structure]
input_schema: schemas/dssp.input.json
output_schema: schemas/dssp.output.json
supported_precisions: [fp32]
supports_batching: false
fusion:
  output_kind: disk
  input_kinds: [disk]
weight_uris: []
entry_point: "vibeproteinagent.adapters.dssp.adapter:DSSPAdapter"
