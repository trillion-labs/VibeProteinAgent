name: interpro_sequences
version: "1.0.0"
category: retrieval
description: "Retrieves UniProt FASTA sequences belonging to an InterPro domain or family accession (e.g., IPR000123). Filters by organism, length, review status, and date cutoff. Use for domain/family-driven sequence collection (paralog libraries, family MSAs)."
runtime: python
backend: numpy
gpu_required: false
startup_cost: low
estimated_runtime_s: 60
warm_load_capable: false
pin_warm: false
supported_tasks: [interpro_sequences]
input_schema: schemas/interpro_sequences.input.json
output_schema: schemas/interpro_sequences.output.json
supported_precisions: [fp32]
supports_batching: false
entry_point: "vibeproteinagent.adapters.interpro_sequences.adapter:InterProSequencesAdapter"
