name: pxmeter
version: "1.0.0"
category: scoring
description: "Computes structural-accuracy metrics (lDDT, DockQ, and related) between a predicted and a reference structure (both mmCIF), with optional explicit chain-pair mapping. Use to score fold/dock predictions against ground truth; for plain pairwise alignment use `tmalign`."
runtime: python
backend: pytorch
gpu_required: false
vram_min_gib: 1
startup_cost: low
estimated_runtime_s: 30
warm_load_capable: true
pin_warm: true
supported_tasks: [structure_evaluation]
input_schema: schemas/pxmeter.input.json
output_schema: schemas/pxmeter.output.json
supported_precisions: [fp32]
supports_batching: false
fusion:
  output_kind: disk
  input_kinds: [disk]
weight_uris: []
entry_point: "vibeproteinagent.adapters.pxmeter.adapter:PXMeterAdapter"
