name: colabdesign_utils
version: "0.1.0"
category: protein_design
description: "Diagnostic probe that reports ColabDesign runtime/sidecar availability and import status. Performs no scientific computation; use only to check whether ColabDesign-backed workflows can run."
runtime: python
backend: mixed
gpu_required: false
gpus_required: 1
startup_cost: low
estimated_runtime_s: 30
warm_load_capable: false
pin_warm: false
support_status: verified
support_status_reason: null
availability_probe: "vibeproteinagent.adapters.colabdesign_utils:availability_skip_reason"
supported_tasks: [colabdesign_utilities, dependency_probe]
input_schema: schemas/colabdesign_utils.input.json
output_schema: schemas/colabdesign_utils.output.json
supported_precisions: [fp32]
supports_batching: false
entry_point: "vibeproteinagent.adapters.colabdesign_utils.adapter:ColabDesignUtilsAdapter"
