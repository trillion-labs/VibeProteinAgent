name: boltzgen
version: "0.3.2"
category: protein_design
description: "Generative end-to-end binder design framework. Runs design, inverse folding, structure prediction, and analysis from a target PDB, BoltzGen YAML specification, or upstream structure candidate."
runtime: python
backend: pytorch
gpu_required: true
gpus_required: 1
vram_min_gib: 20
startup_cost: high
estimated_runtime_s: 600
warm_load_capable: false
pin_warm: false
execution_isolation: subprocess
environment_reason: "Each run launches the BoltzGen CLI in a fresh child process to isolate Hydra/Lightning global state; no model or checkpoint state remains resident across calls."
availability_probe: "vibeproteinagent.adapters.boltzgen:availability_skip_reason"
supported_tasks: [protein_design, peptide_design, binder_design]
input_schema: schemas/boltzgen.input.json
output_schema: schemas/boltzgen.output.json
supported_precisions: [bf16]
supports_batching: false
sharding:
  strategy: design_seed_shards
  shardable_fields: [num_designs, seed]
  recommended_shard_size: 1
  default_max_parallel: 2
fusion:
  output_kind: disk
  input_kinds: [disk]
entry_point: "vibeproteinagent.adapters.boltzgen.adapter:BoltzGenAdapter"
