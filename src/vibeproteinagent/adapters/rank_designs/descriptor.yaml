name: rank_designs
version: "1.0.0"
category: analysis
description: "Aggregates upstream prediction outputs, structure-analysis records, and QC results for a candidate set and returns a deterministically ranked top-K list. Use as the final triage step in a design workflow."
runtime: python
backend: numpy
gpu_required: false
startup_cost: low
estimated_runtime_s: 5
warm_load_capable: false
pin_warm: false
supported_tasks: [ranking, design_triage]
input_schema: schemas/rank_designs.input.json
output_schema: schemas/rank_designs.output.json
supported_precisions: [fp32]
supports_batching: true
weight_uris: []
entry_point: "vibeproteinagent.adapters.rank_designs.adapter:RankDesignsAdapter"
