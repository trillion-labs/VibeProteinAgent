name: proteina_complexa
version: "1.0.0"
category: protein_design
description: "Atomistic generative design with three modes: `protein_binder` (binder vs protein target PDB), `ligand_binder` (binder around a ligand pocket given SMILES + pocket residues), and `motif` (scaffold a motif PDB into a longer monomer). Returns designed sequences plus 3D structures."
runtime: python
backend: pytorch
gpu_required: true
gpus_required: 1
vram_min_gib: 24
startup_cost: high
estimated_runtime_s: 600
warm_load_capable: true
pin_warm: false
execution_isolation: persistent_sidecar
environment_name: proteina-complexa-uv
environment_reason: "Proteina-Complexa pins incompatible scientific dependencies; the unified adapter delegates to one warm sidecar-backed mode at runtime."
support_status: verified
support_status_reason: null
availability_probe: "vibeproteinagent.adapters.proteina_complexa:availability_skip_reason"
supported_tasks: [binder_design, ligand_binder_design, motif_scaffolding]
input_schema: schemas/proteina_complexa.input.json
output_schema: schemas/proteina_complexa.output.json
supported_precisions: [fp32]
supports_batching: false
fusion:
  output_kind: disk
  input_kinds: [disk]
entry_point: "vibeproteinagent.adapters.proteina_complexa.adapter:ProteinaComplexaAdapter"
