name: ligandmpnn
version: "1.0.0"
category: inverse_folding
description: "Ligand-aware inverse folding for fixed backbones. Redesigned_positions are FASTA/sequence 1-indexed when sequence/fasta_path is provided; redesigned_residues is explicit PDB residue-id syntax."
runtime: python
backend: pytorch
gpu_required: true
gpus_required: 1
vram_min_gib: 2
startup_cost: low
estimated_runtime_s: 30
warm_load_capable: true
pin_warm: true
supported_tasks: [sequence_design, ligand_aware_design]
input_schema: schemas/ligandmpnn.input.json
output_schema: schemas/ligandmpnn.output.json
supported_precisions: [fp32, bf16]
supports_batching: true
sharding:
  strategy: warm_batch_shards
  shardable_fields: [num_designs, seed]
  recommended_shard_size: 8
  default_max_parallel: 4
fusion:
  output_kind: disk
  input_kinds: [disk]
weight_uris:
  - uri: "vendor://ligandmpnn/weights/ligandmpnn_v_32_020_25.pt"
    sha256: "42caaa5cdb380867d2b31c30de4ab53ea89171279b3a0732ddf94bc4d3cb6981"
    size_bytes: 10541943
entry_point: "vibeproteinagent.adapters.ligandmpnn.adapter:LigandMPNNAdapter"
