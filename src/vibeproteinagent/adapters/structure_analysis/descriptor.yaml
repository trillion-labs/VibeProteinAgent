name: structure_analysis
version: "1.0.0"
category: analysis
description: "Per-residue structural-environment analysis from a single PDB/mmCIF: solvent exposure (RSA), contacts, interface residues against specified partner chains, ligand-contact residues, and mutation-liability flags. For comparing two structures use `tmalign` or `pxmeter`."
runtime: python
backend: numpy
gpu_required: false
startup_cost: low
estimated_runtime_s: 20
warm_load_capable: false
pin_warm: false
supported_tasks: [structure_analysis]
input_schema: schemas/structure_analysis.input.json
output_schema: schemas/structure_analysis.output.json
supported_precisions: [fp32]
supports_batching: false
entry_point: "vibeproteinagent.adapters.structure_analysis.adapter:StructureAnalysisAdapter"
