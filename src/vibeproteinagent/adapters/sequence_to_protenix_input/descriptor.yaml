name: sequence_to_protenix_input
version: "1.0.0"
category: misc
description: "Format converter that reads a raw protein sequence or FASTA and emits a Protenix-v2 input JSON ready for structure prediction. Use to prepare arbitrary sequences (not from ProteinMPNN) for `protenix_v2`; for ProteinMPNN FASTA outputs use `mpnn_to_protenix_input`."
runtime: python
backend: numpy
gpu_required: false
startup_cost: low
estimated_runtime_s: 5
warm_load_capable: false
pin_warm: false
supported_tasks: [format_conversion, refold_preparation]
input_schema: schemas/sequence_to_protenix_input.input.json
output_schema: schemas/sequence_to_protenix_input.output.json
supported_precisions: [fp32]
supports_batching: true
weight_uris: []
entry_point: "vibeproteinagent.adapters.sequence_to_protenix_input.adapter:SequenceToProtenixInputAdapter"
