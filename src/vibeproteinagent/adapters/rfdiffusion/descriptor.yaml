name: rfdiffusion
version: "1.0.0"
category: protein_design
description: "Backbone generation for unconditional design, motif scaffolding, and target-conditioned binders. Integer target_residues/target_hotspots are FASTA/sequence 1-indexed when target_sequence/target_fasta_path is provided; raw contigs remain RFdiffusion-native structure syntax."
runtime: python
backend: pytorch
gpu_required: true
gpus_required: 1
vram_min_gib: 24
startup_cost: high
estimated_runtime_s: 600
warm_load_capable: false
pin_warm: false
execution_isolation: subprocess
environment_reason: "Each RFdiffusion run launches a fresh subprocess to isolate Hydra and RFdiffusion import-time global state."
support_status: verified
support_status_reason: null
availability_probe: "vibeproteinagent.adapters.rfdiffusion:availability_report"
supported_tasks:
  - backbone_generation
  - unconditional_generation
  - motif_scaffolding
  - symmetric_motif_scaffolding
  - partial_diffusion
  - binder_backbone_design
  - fold_conditioning
  - symmetric_oligomer_design
input_schema: schemas/rfdiffusion.input.json
output_schema: schemas/rfdiffusion.output.json
supported_precisions: [fp32]
supports_batching: false
sharding:
  strategy: design_seed_shards
  shardable_fields: [num_designs, seed]
  recommended_shard_size: 1
  default_max_parallel: 4
fusion:
  output_kind: disk
  input_kinds: [disk]
entry_point: "vibeproteinagent.adapters.rfdiffusion.adapter:RFdiffusionAdapter"
