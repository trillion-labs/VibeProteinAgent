name: pyrosetta
version: "1.0.0"
category: scoring
description: "Rosetta physics-based scoring and refinement on a PDB. Modes: `score` (REF2015 total energy), `interface` (InterfaceAnalyzer: ΔG, ΔSASA, shape complementarity on chain-A vs chain-B), `relax` (FastRelax), `pack` (rotamer repack). Score function tag is selectable."
runtime: python
backend: binary
gpu_required: false
vram_min_gib: null
startup_cost: low
estimated_runtime_s: 30
warm_load_capable: true
pin_warm: true
execution_isolation: persistent_sidecar
environment_name: pyrosetta-vpa
environment_reason: "PyRosetta is installed in the shared vpa env on this host; a persistent sidecar isolates Rosetta global state and avoids per-call cold starts. $VPA_PYROSETTA_ENV may point to a separate env."
support_status: verified
support_status_reason: null
availability_probe: "vibeproteinagent.adapters.pyrosetta:availability_skip_reason"
supported_tasks: [scoring, relaxation]
input_schema: schemas/pyrosetta.input.json
output_schema: schemas/pyrosetta.output.json
supported_precisions: [fp32]
entry_point: "vibeproteinagent.adapters.pyrosetta.adapter:PyRosettaAdapter"
