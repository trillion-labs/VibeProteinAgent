name: pxdesign
version: "1.0.0"
category: protein_design
description: "Target-conditioned binder backbone diffusion against a protein target (optional hotspots). Modes: `infer` returns backbones only (sequence = `X`); `pipeline` adds AF2 initial-guess + ProteinMPNN + filtering for real designed sequences."
runtime: python
backend: pytorch
gpu_required: true
gpus_required: 1
vram_min_gib: 24
startup_cost: high
estimated_runtime_s: 600
warm_load_capable: true
pin_warm: false
execution_isolation: persistent_sidecar
environment_name: pxdesign-pipeline-vpa
environment_reason: "Pipeline mode needs AF2/JAX/ColabDesign dependencies isolated from the shared vpa env; a persistent sidecar avoids per-call cold starts while infer mode remains in-process."
support_status: verified
support_status_reason: null
availability_probe: "vibeproteinagent.adapters.pxdesign:availability_skip_reason"
supported_tasks: [binder_design]
input_schema: schemas/pxdesign.input.json
output_schema: schemas/pxdesign.output.json
supported_precisions: [bf16]
supports_batching: false
incompatible_with: [protenix_v2]
sharding:
  strategy: design_seed_shards
  shardable_fields: [num_samples, seed]
  recommended_shard_size: 1
  default_max_parallel: 2
entry_point: "vibeproteinagent.adapters.pxdesign.adapter:PXDesignAdapter"
