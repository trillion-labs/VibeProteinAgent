name: esm2
version: "1.1.0"
category: protein_design
description: "Sequence-only protein language model. Embedding returns per-residue/pooled embeddings; sequence_generation fills mask chars and 1-indexed mask_positions."
runtime: python
backend: pytorch
gpu_required: true
gpus_required: 1
vram_min_gib: 1
startup_cost: low
estimated_runtime_s: 30
warm_load_capable: true
pin_warm: true
supported_tasks: [sequence_generation, partial_sequence_design, embedding, per_residue_embedding]
input_schema: schemas/esm2.input.json
output_schema: schemas/esm2.output.json
supported_precisions: [fp32, bf16]
supports_batching: false
fusion:
  output_kind: disk
  input_kinds: [disk]
weight_uris: []
entry_point: "vibeproteinagent.adapters.esm2.adapter:ESM2Adapter"
