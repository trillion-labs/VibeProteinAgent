name: boltz2_affinity
version: "2.0.0"
category: structure_prediction
description: "Predicts 3D structure of a protein-ligand or general biomolecular complex and emits a calibrated binding-affinity score for a designated binder chain. Input: Boltz YAML or inline typed sequences (protein/RNA/DNA/ligand). Prefer over `protenix_v2` when affinity is also needed."
runtime: python
backend: pytorch
gpu_required: true
gpus_required: 1
vram_min_gib: 16
startup_cost: high
estimated_runtime_s: 600
warm_load_capable: true
pin_warm: true
supported_tasks: [structure_prediction, affinity_prediction]
input_schema: schemas/boltz2_affinity.input.json
output_schema: schemas/boltz2_affinity.output.json
supported_precisions: [bf16]
supports_batching: false
fusion:
  output_kind: disk
  input_kinds: [disk]
entry_point: "vibeproteinagent.adapters.boltz2_affinity.adapter:Boltz2AffinityAdapter"
