name: boltz2_affinity
version: "2.0.0"
category: structure_prediction
description: "Predicts a Boltz-2 complex structure and calibrated affinity for a designated small-molecule ligand chain. Do not use for protein-protein binder affinity; use ipSAE, PRODIGY, PyRosetta, or structure-confidence tools instead."
runtime: python
backend: pytorch
gpu_required: true
gpus_required: 1
vram_min_gib: 16
startup_cost: high
estimated_runtime_s: 600
warm_load_capable: true
pin_warm: true
supported_tasks: [structure_prediction, affinity_prediction]
input_schema: schemas/boltz2_affinity.input.json
output_schema: schemas/boltz2_affinity.output.json
supported_precisions: [bf16]
supports_batching: false
sharding:
  strategy: seed_shards
  shardable_fields: [seeds, diffusion_samples, diffusion_samples_affinity]
  recommended_shard_size: 1
  default_max_parallel: 2
fusion:
  output_kind: disk
  input_kinds: [disk]
entry_point: "vibeproteinagent.adapters.boltz2_affinity.adapter:Boltz2AffinityAdapter"
