schema_version: 1
package: vibeproteinagent
defaults:
  install_root: "~/.vibeproteinagent"
  shared_env: "envs/vpa"
  sidecars_root: "sidecars"
  cache_dir: "cache"
  state_db: "install/state.json"
  default_profile: full
  shared_env_ref: "envs/vpa/{cuda_profile}"
profiles:
  base:
    description: "Core VPA runtime plus lightweight local tools."
    tools:
      - family_profile
      - sequence_analysis
      - sequence_edit
      - structure_analysis
      - protein_qc
      - rank_designs
  full:
    description: "Every supported first-class in-tree tool, sidecar, and required model weight."
    tools:
      - bindcraft
      - boltz2_affinity
      - boltzgen
      - esm2
      - esm3
      - family_profile
      - foldseek
      - go_sequences
      - interpro_sequences
      - ipsae
      - ligandmpnn
      - literature_search
      - mmseqs2_gpu
      - prodigy
      - proteina_complexa
      - protein_qc
      - proteinmpnn
      - protenix_v2
      - pxdesign
      - pxmeter
      - pyrosetta
      - rank_designs
      - rfdiffusion
      - rfdiffusion3
      - rfpeptides
      - search_sequence
      - sequence_analysis
      - sequence_edit
      - structure_analysis
      - template_select
      - tmalign
      - vina
tool_defaults:
  runtime: shared
  required: true
tools:
  bindcraft:
    runtime: sidecar
    required: false
    sidecar:
      env_name: BindCraft
      path: "sidecars/bindcraft"
      prebuilt_ref: "sidecars/bindcraft/{cuda_profile}"
      install_script: "bash -lc 'cd vendor/bindcraft && bash install_bindcraft.sh --pkg_manager micromamba --env-prefix {sidecar_path} --cuda {bindcraft_cuda}'"
    disk_bytes: 120000000000
  boltz2_affinity:
    runtime: shared
    required: false
    sources:
      - name: boltz_source
        path: "sidecars/boltz"
        env_var: VPA_BOLTZ_TREE
        repo: "https://github.com/jwohlwend/boltz.git"
        ref: "cb04aeccdd480fd4db707f0bbafde538397fa2ac"
        markers:
          - "src/boltz/main.py"
        required: true
    weights:
      - name: boltz2_conf
        path: "cache/boltz/boltz2_conf.ckpt"
        env_var: VPA_BOLTZ_CACHE
        artifact_ref: "boltz2/boltz2_conf.ckpt"
        url: "https://huggingface.co/boltz-community/boltz-2/resolve/main/boltz2_conf.ckpt"
        source_path: "/opt/vpa-data/boltz_cache/boltz2_conf.ckpt"
        required: true
      - name: boltz2_aff
        path: "cache/boltz/boltz2_aff.ckpt"
        env_var: VPA_BOLTZ_CACHE
        artifact_ref: "boltz2/boltz2_aff.ckpt"
        url: "https://huggingface.co/boltz-community/boltz-2/resolve/main/boltz2_aff.ckpt"
        source_path: "/opt/vpa-data/boltz_cache/boltz2_aff.ckpt"
        required: true
      - name: boltz_mols
        path: "cache/boltz/mols"
        env_var: VPA_BOLTZ_CACHE
        artifact_ref: "boltz2/mols"
        url: "https://huggingface.co/boltz-community/boltz-2/resolve/main/mols.tar"
        unpack: tar
        source_path: "/opt/vpa-data/boltz_cache/mols"
        required: true
    disk_bytes: 12000000000
  boltzgen:
    runtime: shared
    required: false
    sources:
      - name: boltzgen_source
        path: "sidecars/boltzgen"
        env_var: VPA_BOLTZGEN_TREE
        repo: "https://github.com/HannesStark/boltzgen.git"
        ref: "31d9d9b9c72245b4ed6fe8742d6fbf4e1a3552a0"
        markers:
          - "src/boltzgen/cli/boltzgen.py"
        required: true
    weights:
      - name: boltzgen_model_cache
        path: "cache/boltzgen/models--boltzgen--boltzgen-1"
        env_var: VPA_BOLTZGEN_CACHE
        env_value: path
        hf_repo_id: "boltzgen/boltzgen-1"
        hf_repo_type: model
        source_path: "/opt/vpa-data/boltzgen_cache/models--boltzgen--boltzgen-1"
        required: true
      - name: boltzgen_inference_data
        path: "cache/boltzgen/datasets--boltzgen--inference-data"
        env_var: VPA_BOLTZGEN_CACHE
        env_value: path
        hf_repo_id: "boltzgen/inference-data"
        hf_repo_type: dataset
        source_path: "/opt/vpa-data/boltzgen_cache/datasets--boltzgen--inference-data"
        required: true
      - name: boltzgen_cache
        path: "cache/boltzgen"
        env_var: VPA_BOLTZGEN_CACHE
        env_value: path
        artifact_ref: "boltzgen/cache"
        source_path: "/opt/vpa-data/boltzgen_cache"
        required: false
    disk_bytes: 50000000000
  esm2:
    runtime: shared
    required: false
    weights:
      - name: esm2_cache
        path: "cache/huggingface"
        env_var: HF_HOME
        artifact_ref: "huggingface/esm2_cache"
        source_path: "/opt/vpa-data/models/huggingface"
        required: false
    disk_bytes: 3000000000
  esm3:
    runtime: shared
    required: false
    access_requirements:
      - hf_token
    weights:
      - name: esm3_cache
        path: "cache/huggingface"
        env_var: HF_HOME
        artifact_ref: "huggingface/esm3_cache"
        hf_repo_id: "EvolutionaryScale/esm3-sm-open-v1"
        hf_repo_type: model
        source_path: "/opt/vpa-data/models/huggingface"
        required: true
    disk_bytes: 6000000000
  family_profile:
    runtime: shared
  foldseek:
    runtime: external_binary
    required: false
    binary: foldseek
    weights:
      - name: foldseek_binary
        path: "envs/vpa/bin/foldseek"
        artifact_ref: "external_binaries/foldseek"
        source_path: "/opt/miniconda3/envs/vpa/bin/foldseek"
        required: true
  function_term_resolver:
    runtime: shared
  go_term_search:
    runtime: shared
  go_sequences:
    runtime: shared
  interpro_entry_lookup:
    runtime: shared
  interpro_entry_search:
    runtime: shared
  interpro_sequences:
    runtime: shared
  ipsae:
    runtime: shared
  ligandmpnn:
    runtime: shared
    required: false
    weights:
      - name: ligandmpnn_weights
        path: "models/ligandmpnn_v_32_020_25.pt"
        artifact_ref: "ligandmpnn/ligandmpnn_v_32_020_25.pt"
        source_path: "vendor/ligandmpnn/weights/ligandmpnn_v_32_020_25.pt"
        env_var: VPA_MODEL_CACHE
        required: true
    disk_bytes: 1000000000
  literature_search:
    runtime: shared
  search_sequence:
    runtime: shared
  merge_candidates:
    runtime: shared
    required: false
  mmseqs2_gpu:
    runtime: external_binary
    required: false
    binary: mmseqs
    weights:
      - name: mmseqs_binary
        path: "envs/vpa/bin/mmseqs"
        artifact_ref: "external_binaries/mmseqs"
        source_path: "/opt/vpa-data/mmseqs2-gpu/bin/mmseqs"
        required: true
  mpnn_to_protenix_input:
    runtime: shared
  noop:
    runtime: shared
    required: false
  ontology_lookup:
    runtime: shared
  prodigy:
    runtime: shared
  protein_qc:
    runtime: shared
  proteinmpnn:
    runtime: shared
    weights:
      - name: proteinmpnn_weights
        path: "models/v_48_020.pt"
        env_var: VPA_MODEL_CACHE
        url: "https://raw.githubusercontent.com/dauparas/ProteinMPNN/8907e6671bfbfc92303b5f79c4b5e6ce47cdef57/vanilla_model_weights/v_48_020.pt"
        sha256: "c9cb4a671d79604111231f8dbfc7c590e06f1197453b7a6854ac6661a642f5bd"
        source_path: "vendor/proteinmpnn/weights/v_48_020.pt"
        required: true
    disk_bytes: 500000000
  proteina_complexa:
    runtime: sidecar
    required: false
    sidecar:
      env_name: proteina-complexa-vpa
      path: "sidecars/proteina-complexa"
      prebuilt_ref: "sidecars/proteina-complexa/{cuda_profile}"
      install_script: "bash vendor/proteina-complexa/env/build_uv_env.sh --root {sidecar_path} --cuda-profile {cuda_profile}"
    weights:
      - name: proteina_complexa_checkpoints
        path: "cache/proteina-complexa/checkpoints"
        artifact_ref: "proteina_complexa/checkpoints"
        source_path: "vendor/proteina-complexa/ckpts"
        env_var: VPA_PROTEINA_COMPLEXA_CKPTS
        env_value: path
        required: true
    disk_bytes: 30000000000
  protenix_v2:
    runtime: shared
    required: false
    sources:
      - name: protenix_source
        path: "sidecars/protenix"
        env_var: VPA_PROTENIX_TREE
        repo: "https://github.com/bytedance/Protenix.git"
        markers:
          - "runner"
          - "protenix"
        required: true
    weights:
      - name: protenix_checkpoint
        path: "cache/protenix/protenix_base_default_v1.0.0.pt"
        artifact_ref: "protenix_v2/protenix_base_default_v1.0.0.pt"
        url: "https://protenix.tos-cn-beijing.volces.com/checkpoint/protenix_base_default_v1.0.0.pt"
        env_var: VPA_PROTENIX_CKPT
        required: true
      - name: protenix_ccd_cache
        path: "cache/protenix/common"
        artifact_ref: "protenix_v2/common"
        url: "https://protenix.tos-cn-beijing.volces.com/common.tar.gz"
        unpack: tar
        env_var: VPA_PROTENIX_CKPT
        required: true
    disk_bytes: 8000000000
  pxdesign:
    runtime: shared
    required: false
    sidecar:
      env_name: pxdesign-pipeline-vpa
      path: "sidecars/pxdesign-pipeline"
      prebuilt_ref: "sidecars/pxdesign-pipeline/{cuda_profile}"
      install_script: "bash scripts/install_pxdesign_pipeline_sidecar.sh --prefix {sidecar_path} --cuda-profile {cuda_profile}"
    weights:
      - name: pxdesign_weights
        path: "cache/pxdesign"
        artifact_ref: "pxdesign/checkpoints"
        source_path: "/opt/vpa-data/pxdesign_ckpt"
        env_var: VPA_PXDESIGN_CKPT_DIR
        env_value: path
        required: true
  pxmeter:
    runtime: shared
  pyrosetta:
    runtime: shared
    required: false
    artifact_policy: redistributable
    license_notice: "Installs without a VPA license key; follow upstream PyRosetta/Rosetta Commons terms. Upstream states commercial use requires a separate license."
    license_url: "https://www.pyrosetta.org/downloads"
  rank_designs:
    runtime: shared
  submit_candidate:
    runtime: shared
  rfdiffusion:
    runtime: shared
    weights:
      - name: rfdiffusion_base
        path: "cache/rfdiffusion/Base_ckpt.pt"
        env_var: VPA_RFDIFFUSION_WEIGHTS
        url: "http://files.ipd.uw.edu/pub/RFdiffusion/6f5902ac237024bdd0c176cb93063dc4/Base_ckpt.pt"
        sha256: "0fcf7d7c32b4848030aca3a051e6768de194616f96ba6c38186351a33bfc6eca"
        source_path: "vendor/rfpeptides/weights/Base_ckpt.pt"
        modes:
          - unconditional
          - motif
          - partial
          - symmetric
        required: true
      - name: rfdiffusion_complex
        path: "cache/rfdiffusion/Complex_base_ckpt.pt"
        env_var: VPA_RFDIFFUSION_WEIGHTS
        url: "http://files.ipd.uw.edu/pub/RFdiffusion/e29311f6f1bf1af907f9ef9f44b8328b/Complex_base_ckpt.pt"
        sha256: "76e4e260aefee3b582bd76b77ab95d2592e64f00c51bf344968ab9239f3250bc"
        source_path: "vendor/rfpeptides/weights/Complex_base_ckpt.pt"
        modes:
          - binder
          - symmetric_motif
        required: false
      - name: rfdiffusion_fold
        path: "cache/rfdiffusion/Complex_Fold_base_ckpt.pt"
        env_var: VPA_RFDIFFUSION_WEIGHTS
        url: "http://files.ipd.uw.edu/pub/RFdiffusion/60f09a193fb5e5ccdc4980417708dbab/Complex_Fold_base_ckpt.pt"
        sha256: "0ac3b4024aea811078cec41482528291d6d7d7084bf8190ec118f54642fb81a1"
        source_path: "vendor/rfpeptides/weights/Complex_Fold_base_ckpt.pt"
        modes:
          - fold_conditioning
        required: false
    smoke_test: "tests/test_adapter_rfdiffusion_real.py"
    disk_bytes: 1600000000
  rfdiffusion3:
    runtime: sidecar
    required: false
    sidecar:
      env_name: rfdiffusion3-vpa
      path: "sidecars/rfdiffusion3"
      prebuilt_ref: "sidecars/rfdiffusion3/{cuda_profile}"
      install_script: "bash scripts/install_rfdiffusion3_sidecar.sh --prefix {sidecar_path} --repo-root {repo_root} --cuda-profile {cuda_profile}"
    weights:
      - name: rfdiffusion3_checkpoint
        path: "cache/rfdiffusion3/rfd3_latest.ckpt"
        artifact_ref: "rfdiffusion3/rfd3_latest.ckpt"
        source_path: "vendor/rfdiffusion3/checkpoints/rfd3_latest.ckpt"
        env_var: VPA_RFDIFFUSION3_CKPT
        env_value: path
        required: true
    disk_bytes: 6000000000
  rfpeptides:
    runtime: shared
    required: false
    weights:
      - name: rfpeptides_weights
        path: "cache/rfpeptides"
        artifact_ref: "rfpeptides/weights"
        source_path: "vendor/rfpeptides/weights"
        env_var: VPA_RFPEPTIDES_WEIGHTS
        env_value: path
        required: true
    disk_bytes: 2000000000
  sequence_analysis:
    runtime: shared
  sequence_edit:
    runtime: shared
  sequence_to_protenix_input:
    runtime: shared
  structure_analysis:
    runtime: shared
  template_select:
    runtime: shared
    required: false
    depends_on:
      - mmseqs2_gpu
      - foldseek
  tmalign:
    runtime: external_binary
    required: false
    binary: TMalign
    weights:
      - name: tmalign_binary
        path: "envs/vpa/bin/TMalign"
        artifact_ref: "external_binaries/TMalign"
        source_path: "/opt/miniconda3/envs/vpa/bin/TMalign"
        required: true
  vina:
    runtime: external_binary
    required: false
    binary: vina
    weights:
      - name: vina_binary
        path: "envs/vpa/bin/vina"
        artifact_ref: "external_binaries/vina"
        source_path: "/opt/miniconda3/envs/vpa/bin/vina"
        required: true
