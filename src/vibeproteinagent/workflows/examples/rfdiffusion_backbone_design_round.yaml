name: rfdiffusion_backbone_design_round
version: "1.0.0"
description: "Generate one RFdiffusion backbone, design sequences, refold, analyze structure, QC, and rank candidates."
params:
  length: {type: int, required: true}
  mpnn_num_designs: {type: int, default: 4}
  top_k: {type: int, default: 1}
nodes:
  - id: backbone
    tool: rfdiffusion
    version: ">=1.0.0,<2"
    inputs:
      mode: unconditional
      length_min: ${params.length}
      length_max: ${params.length}
      num_designs: 1
    cache: false
  - id: design
    tool: proteinmpnn
    version: ">=1.0.0,<2"
    inputs:
      pdb_path: ${outputs.backbone.designs[0].pdb_path}
      num_designs: ${params.mpnn_num_designs}
      temperature: 0.1
      seed: 42
    cache: true
  - id: protenix_input
    tool: mpnn_to_protenix_input
    version: ">=1.0.0,<2"
    inputs:
      designs_fasta: ${outputs.design.designs_fasta}
      top_k: ${params.top_k}
      name_prefix: rfdiffusion_refold
    cache: true
  - id: refold
    tool: protenix_v2
    version: ">=1.0.0,<2"
    foreach: ${outputs.protenix_input.input_jsons}
    max_parallel: 2
    inputs:
      input_json: ${item}
      seeds: [101]
      use_msa: false
      n_sample: 1
      n_step: 20
      n_cycle: 1
    cache: true
  - id: analyze_refold
    tool: structure_analysis
    version: ">=1.0.0,<2"
    foreach: ${outputs.refold}
    max_parallel: 4
    inputs:
      structure_path: ${item.predicted_cif}
      max_annotations: 100
    cache: true
  - id: qc
    tool: protein_qc
    version: ">=1.0.0,<2"
    foreach: ${outputs.refold}
    max_parallel: 4
    inputs:
      pdb_path: ${item.predicted_cif}
    cache: true
  - id: rank
    tool: rank_designs
    version: ">=1.0.0,<2"
    inputs:
      predictions: ${outputs.refold}
      analyses: ${outputs.analyze_refold}
      qc_results: ${outputs.qc}
      top_k: ${params.top_k}
    cache: true
