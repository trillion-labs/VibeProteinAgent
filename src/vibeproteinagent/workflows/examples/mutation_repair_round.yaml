name: mutation_repair_round
version: "1.0.0"
description: "Analyze a structure, apply substitutions, refold the repaired sequence, re-analyze, and rank it."
params:
  structure_path: {type: path, required: true}
  wild_type_sequence: {type: str, required: true}
  mapping: {type: dict, required: true}
  top_k: {type: int, default: 1}
nodes:
  - id: structure_context
    tool: structure_analysis
    version: ">=1.0.0,<2"
    inputs:
      structure_path: ${params.structure_path}
      sequence: ${params.wild_type_sequence}
      max_annotations: 100
    cache: true
  - id: mutate
    tool: sequence_edit
    version: ">=1.0.0,<2"
    inputs:
      operation: mutate_residues
      sequence: ${params.wild_type_sequence}
      mapping: ${params.mapping}
      output_name: repaired
    cache: true
  - id: protenix_input
    tool: sequence_to_protenix_input
    version: ">=1.0.0,<2"
    inputs:
      sequence: ${outputs.mutate.mutant_sequence}
      name: repaired
      seeds: [101]
    cache: true
  - id: refold
    tool: protenix_v2
    version: ">=1.0.0,<2"
    inputs:
      input_json: ${outputs.protenix_input.input_json}
      seeds: [101]
      use_msa: false
      n_sample: 1
      n_step: 20
      n_cycle: 1
    cache: true
  - id: repaired_context
    tool: structure_analysis
    version: ">=1.0.0,<2"
    inputs:
      structure_path: ${outputs.refold.predicted_cif}
      sequence: ${outputs.mutate.mutant_sequence}
      max_annotations: 100
    cache: true
  - id: rank
    tool: rank_designs
    version: ">=1.0.0,<2"
    inputs:
      predictions:
        - ${outputs.refold}
      analyses:
        - ${outputs.repaired_context}
      top_k: ${params.top_k}
    cache: true
