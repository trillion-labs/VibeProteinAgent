[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "vibeproteinagent"
dynamic = ["version"]
description = "Local-first GPU-ready protein design tool substrate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "VibeProteinAgent contributors" }]
keywords = ["protein", "gpu", "mcp", "workflow", "bioinformatics"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: Other/Proprietary License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.5",
  "rich>=13",
  "pyyaml>=6",
  "msgpack>=1.0",
  "aiosqlite>=0.20",
  "jsonschema>=4",
  "mcp>=1.0",
  "ninja>=1.11",
  "numpy>=1.26",
  "pyarrow>=16",
  "biopython>=1.83",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
vpa = "vibeproteinagent.cli.main:app"
vibeproteinagent = "vibeproteinagent.cli.main:app"

[project.entry-points."vibeproteinagent.tools"]
# Populated by adapter packages.

[project.entry-points."vibeproteinagent.workflows"]
# Populated by workflow packages.

[tool.hatch.version]
path = "src/vibeproteinagent/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vibeproteinagent"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "vibeproteinagent/THIRD_PARTY_NOTICES.md"
"src/vibeproteinagent/install/manifest.yaml" = "vibeproteinagent/install/manifest.yaml"
"src/vibeproteinagent/reporting/assets/3Dmol-min.js" = "vibeproteinagent/reporting/assets/3Dmol-min.js"
"src/vibeproteinagent/reporting/assets/3Dmol-min.js.LICENSE.txt" = "vibeproteinagent/reporting/assets/3Dmol-min.js.LICENSE.txt"
"src/vibeproteinagent/visualization/assets/3Dmol-min.js" = "vibeproteinagent/visualization/assets/3Dmol-min.js"
"src/vibeproteinagent/visualization/assets/3Dmol-min.js.LICENSE.txt" = "vibeproteinagent/visualization/assets/3Dmol-min.js.LICENSE.txt"

[tool.hatch.build.targets.sdist]
include = [
  "src/vibeproteinagent",
  "README.md",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "CONTRIBUTING.md",
  "CITATION.cff",
  "containers",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: integration tests that spawn real subprocesses (daemon, workers)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/vibeproteinagent"]
