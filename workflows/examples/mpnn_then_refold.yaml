name: mpnn_then_refold
version: "1.0.0"
description: "Inverse-fold a backbone with ProteinMPNN, then refold the top design with Protenix-v2."
params:
  pdb_path: {type: path, required: true}
  num_designs: {type: int, default: 4}
  top_k: {type: int, default: 1}
nodes:
  - id: design
    tool: proteinmpnn
    version: ">=1.0.0,<2"
    inputs:
      pdb_path: ${params.pdb_path}
      num_designs: ${params.num_designs}
      temperature: 0.1
      seed: 42
    cache: true
  - id: convert
    tool: mpnn_to_protenix_input
    version: ">=1.0.0,<2"
    inputs:
      designs_fasta: ${outputs.design.designs_fasta}
      top_k: ${params.top_k}
      name_prefix: refold
    cache: true
  - id: refold
    tool: protenix_v2
    version: ">=1.0.0,<2"
    foreach: ${outputs.convert.input_jsons}
    max_parallel: 2
    inputs:
      input_json: ${item}
      seeds: [101]
      use_msa: false
      n_sample: 1
      n_step: 20
      n_cycle: 1
    cache: true
