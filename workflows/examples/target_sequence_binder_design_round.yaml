name: target_sequence_binder_design_round
version: "1.0.0"
description: "Fold a target sequence, generate hotspot-directed binders with PXDesign pipeline mode, analyze, QC, and rank candidates."
params:
  target_sequence: {type: str, required: true}
  target_hotspots: {type: list, default: []}
  target_chain: {type: str, default: "A"}
  binder_length: {type: int, default: 60}
  num_samples: {type: int, default: 1}
  num_steps: {type: int, default: 20}
  top_k: {type: int, default: 1}
  submit_final: {type: bool, default: false}
nodes:
  - id: target_input
    tool: sequence_to_protenix_input
    version: ">=1.0.0,<2"
    inputs:
      sequence: ${params.target_sequence}
      name: target
      seeds: [101]
    cache: true
  - id: target_fold
    tool: protenix_v2
    version: ">=1.0.0,<2"
    inputs:
      input_json: ${outputs.target_input.input_json}
      seeds: [101]
      use_msa: false
      n_sample: 1
      n_step: 10
      n_cycle: 1
    cache: true
  - id: binder_design
    tool: pxdesign
    version: ">=1.0.0,<2"
    inputs:
      target_pdb: ${outputs.target_fold.predicted_cif}
      target_chain: ${params.target_chain}
      hotspots: ${params.target_hotspots}
      binder_length: ${params.binder_length}
      num_samples: ${params.num_samples}
      num_steps: ${params.num_steps}
      mode: pipeline
      preset: preview
      top_k_designs: ${params.top_k}
      mpnn_temperature: 0.1
    cache: false
  - id: analyze_binder
    tool: structure_analysis
    version: ">=1.0.0,<2"
    foreach: ${outputs.binder_design.designs}
    max_parallel: 4
    inputs:
      structure_path: ${item.cif_path}
      max_annotations: 100
    cache: true
  - id: qc
    tool: protein_qc
    version: ">=1.0.0,<2"
    foreach: ${outputs.binder_design.designs}
    max_parallel: 4
    inputs:
      sequence: ${item.sequence}
    cache: true
  - id: rank
    tool: rank_designs
    version: ">=1.0.0,<2"
    inputs:
      candidates: ${outputs.binder_design.designs}
      analyses: ${outputs.analyze_binder}
      qc_results: ${outputs.qc}
      top_k: ${params.top_k}
    cache: true
  - id: submit
    tool: submit_candidate
    version: ">=1.0.0,<2"
    when: "params['submit_final']"
    inputs:
      outcome: accepted
      candidates:
        - job_id: ${jobs.rank}
          candidate_id: ${outputs.rank.ranked_candidates[0].candidate_id}
          justification: "Top ranked binder candidate from rank_designs."
          scores_to_highlight: ["score", "ranking_score", "plddt", "iptm", "ptm"]
      reasoning: "Selected the top ranked binder after target folding, hotspot-directed binder design, structure analysis, QC, and ranking."
    cache: false
