<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">VibeProteinAgent framework overview</title>
  <desc id="desc">VibeProteinAgent architecture: user intents enter via the VPA CLI, the orchestrator submits jobs into a durable workspace, warm GPU workers execute protein tools, and human-readable reports summarize the artifacts.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8ff"/>
      <stop offset="1" stop-color="#f1ecfa"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b1ea8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="brandDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d046e"/>
      <stop offset="1" stop-color="#6b1ea8"/>
    </linearGradient>
    <linearGradient id="cyanWash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e5f4fd"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
    <filter id="card" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2d046e" flood-opacity="0.10"/>
    </filter>
    <filter id="cardSoft" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#2d046e" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L11,7 L2,12 Z" fill="#6b1ea8"/>
    </marker>
    <marker id="arrowMuted" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L11,7 L2,12 Z" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#page)"/>

  <!-- title -->
  <text x="56" y="62" font-size="28" font-weight="800" fill="#1a1535">How VibeProteinAgent runs</text>
  <text x="56" y="92" font-size="15" font-weight="500" fill="#6b6491">One CLI surface drives direct tools, multi-step workflows, and LLM-planned runs over a durable workspace, warm GPU workers, and read-only human reports.</text>

  <!-- ============ ROW 1: USER INTENT → CLI → ORCHESTRATOR → WORKSPACE ============ -->

  <!-- User Intent -->
  <g filter="url(#card)">
    <rect x="56" y="146" width="226" height="172" rx="18" fill="#ffffff" stroke="#e8e4f2" stroke-width="1.5"/>
  </g>
  <rect x="56" y="146" width="226" height="40" rx="18" fill="#ede9fe"/>
  <rect x="56" y="166" width="226" height="20" fill="#ede9fe"/>
  <text x="80" y="173" font-size="12" font-weight="700" fill="#6b1ea8" letter-spacing="0.8">USER INTENT</text>
  <text x="80" y="216" font-size="16" font-weight="700" fill="#1a1535">Three entry points</text>
  <g font-size="13" font-weight="500" fill="#1a1535">
    <text x="80" y="244">• direct tool call</text>
    <text x="80" y="268">• workflow YAML</text>
    <text x="80" y="292">• natural language</text>
  </g>

  <!-- VPA CLI -->
  <g filter="url(#card)">
    <rect x="338" y="146" width="244" height="172" rx="18" fill="#ffffff" stroke="#e8e4f2" stroke-width="1.5"/>
  </g>
  <text x="362" y="173" font-size="12" font-weight="700" fill="#6b1ea8" letter-spacing="0.8">VPA CLI</text>
  <text x="362" y="216" font-size="16" font-weight="700" fill="#1a1535">vpa</text>
  <g>
    <rect x="362" y="232" width="196" height="22" rx="11" fill="#f6f5fb" stroke="#e8e4f2"/>
    <text x="376" y="247" font-size="11" font-weight="600" fill="#6b1ea8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">vpa run</text>
    <rect x="362" y="260" width="196" height="22" rx="11" fill="#f6f5fb" stroke="#e8e4f2"/>
    <text x="376" y="275" font-size="11" font-weight="600" fill="#6b1ea8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">vpa workflow run</text>
    <rect x="362" y="288" width="196" height="22" rx="11" fill="#f6f5fb" stroke="#e8e4f2"/>
    <text x="376" y="303" font-size="11" font-weight="600" fill="#6b1ea8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">vpa agent run</text>
  </g>

  <!-- Orchestrator (Workflow/Agent planner) -->
  <g filter="url(#card)">
    <rect x="638" y="146" width="266" height="172" rx="18" fill="#ffffff" stroke="#e8e4f2" stroke-width="1.5"/>
  </g>
  <rect x="638" y="146" width="266" height="40" rx="18" fill="#ede9fe"/>
  <rect x="638" y="166" width="266" height="20" fill="#ede9fe"/>
  <text x="662" y="173" font-size="12" font-weight="700" fill="#6b1ea8" letter-spacing="0.8">ORCHESTRATOR</text>
  <text x="662" y="216" font-size="16" font-weight="700" fill="#1a1535">DAG executor + LLM planner</text>
  <g font-size="13" font-weight="500" fill="#1a1535">
    <text x="662" y="244">• resolves ${params} and ${outputs}</text>
    <text x="662" y="268">• foreach fan-out + caching</text>
    <text x="662" y="292">• Codex · Claude Code · OpenRouter</text>
  </g>

  <!-- Workspace -->
  <g filter="url(#card)">
    <rect x="960" y="146" width="264" height="172" rx="18" fill="#ffffff" stroke="#e8e4f2" stroke-width="1.5"/>
  </g>
  <rect x="960" y="146" width="264" height="40" rx="18" fill="#ede9fe"/>
  <rect x="960" y="166" width="264" height="20" fill="#ede9fe"/>
  <text x="984" y="173" font-size="12" font-weight="700" fill="#6b1ea8" letter-spacing="0.8">WORKSPACE (SQLite)</text>
  <text x="984" y="216" font-size="16" font-weight="700" fill="#1a1535">Durable, local, reproducible</text>
  <g font-size="13" font-weight="500" fill="#1a1535">
    <text x="984" y="244">• jobs · runs · logs</text>
    <text x="984" y="268">• artifacts + content hashes</text>
    <text x="984" y="292">• deterministic IDs · replay</text>
  </g>

  <!-- arrows row 1 -->
  <path d="M282 232 H338" stroke="#6b1ea8" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M582 232 H638" stroke="#6b1ea8" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M904 232 H960" stroke="#6b1ea8" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>

  <!-- vertical connector from row1 to row2: orchestrator dispatches to workers -->
  <path d="M771 318 V374" stroke="#a78bfa" stroke-width="2.4" stroke-dasharray="6 6" fill="none" marker-end="url(#arrowMuted)"/>

  <!-- ============ ROW 2: WARM WORKERS → TOOLS → REPORTS ============ -->

  <!-- Warm Workers -->
  <g filter="url(#card)">
    <rect x="56" y="388" width="298" height="200" rx="18" fill="#ffffff" stroke="#e8e4f2" stroke-width="1.5"/>
  </g>
  <text x="80" y="415" font-size="12" font-weight="700" fill="#6b1ea8" letter-spacing="0.8">WARM WORKERS</text>
  <text x="80" y="458" font-size="16" font-weight="700" fill="#1a1535">GPU-pinned daemons</text>
  <g font-size="13" font-weight="500" fill="#1a1535">
    <text x="80" y="486">• VRAM admission + LRU eviction</text>
    <text x="80" y="510">• shared vpa env</text>
    <text x="80" y="534">• persistent sidecars for conflicts</text>
  </g>
  <g>
    <rect x="80" y="548" width="58" height="22" rx="11" fill="#e5f4fd" stroke="#a5dceb"/>
    <text x="93" y="563" font-size="10" font-weight="700" fill="#0e7a93">GPU 0</text>
    <rect x="148" y="548" width="58" height="22" rx="11" fill="#e5f4fd" stroke="#a5dceb"/>
    <text x="161" y="563" font-size="10" font-weight="700" fill="#0e7a93">GPU 1</text>
    <rect x="216" y="548" width="58" height="22" rx="11" fill="#f6f5fb" stroke="#e8e4f2"/>
    <text x="237" y="563" font-size="10" font-weight="700" fill="#6b6491">…</text>
  </g>

  <!-- Protein Tools -->
  <g filter="url(#card)">
    <rect x="410" y="388" width="476" height="200" rx="18" fill="#ffffff" stroke="#e8e4f2" stroke-width="1.5"/>
  </g>
  <rect x="410" y="388" width="476" height="40" rx="18" fill="#ede9fe"/>
  <rect x="410" y="408" width="476" height="20" fill="#ede9fe"/>
  <text x="434" y="415" font-size="12" font-weight="700" fill="#6b1ea8" letter-spacing="0.8">PROTEIN TOOLS · 30+ ADAPTERS</text>

  <!-- tool chips grid: 3 rows x 4 cols, 110x28, gap 12 -->
  <g font-size="11.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1a1535">
    <!-- row a -->
    <rect x="434" y="446" width="100" height="26" rx="13" fill="#ede9fe" stroke="#d4cee5"/>
    <text x="484" y="463" text-anchor="middle">rfdiffusion</text>
    <rect x="544" y="446" width="100" height="26" rx="13" fill="#ede9fe" stroke="#d4cee5"/>
    <text x="594" y="463" text-anchor="middle">proteinmpnn</text>
    <rect x="654" y="446" width="100" height="26" rx="13" fill="#ede9fe" stroke="#d4cee5"/>
    <text x="704" y="463" text-anchor="middle">protenix v2</text>
    <rect x="764" y="446" width="100" height="26" rx="13" fill="#ede9fe" stroke="#d4cee5"/>
    <text x="814" y="463" text-anchor="middle">boltz 2</text>
    <!-- row b -->
    <rect x="434" y="482" width="100" height="26" rx="13" fill="#e5f4fd" stroke="#a5dceb"/>
    <text x="484" y="499" text-anchor="middle" fill="#0e7a93">bindcraft</text>
    <rect x="544" y="482" width="100" height="26" rx="13" fill="#e5f4fd" stroke="#a5dceb"/>
    <text x="594" y="499" text-anchor="middle" fill="#0e7a93">boltzgen</text>
    <rect x="654" y="482" width="100" height="26" rx="13" fill="#e5f4fd" stroke="#a5dceb"/>
    <text x="704" y="499" text-anchor="middle" fill="#0e7a93">pxdesign</text>
    <rect x="764" y="482" width="100" height="26" rx="13" fill="#e5f4fd" stroke="#a5dceb"/>
    <text x="814" y="499" text-anchor="middle" fill="#0e7a93">esm3</text>
    <!-- row c -->
    <rect x="434" y="518" width="100" height="26" rx="13" fill="#fcebdd" stroke="#f8c98a"/>
    <text x="484" y="535" text-anchor="middle" fill="#a3551b">foldseek</text>
    <rect x="544" y="518" width="100" height="26" rx="13" fill="#fcebdd" stroke="#f8c98a"/>
    <text x="594" y="535" text-anchor="middle" fill="#a3551b">pyrosetta</text>
    <rect x="654" y="518" width="100" height="26" rx="13" fill="#fcebdd" stroke="#f8c98a"/>
    <text x="704" y="535" text-anchor="middle" fill="#a3551b">prodigy</text>
    <rect x="764" y="518" width="100" height="26" rx="13" fill="#fcebdd" stroke="#f8c98a"/>
    <text x="814" y="535" text-anchor="middle" fill="#a3551b">vina</text>
  </g>
  <g font-size="11" font-weight="600">
    <circle cx="442" cy="566" r="4" fill="#a78bfa"/>
    <text x="452" y="570" fill="#6b6491">design</text>
    <circle cx="514" cy="566" r="4" fill="#4cc4e4"/>
    <text x="524" y="570" fill="#6b6491">prediction / embedding</text>
    <circle cx="694" cy="566" r="4" fill="#f39e3a"/>
    <text x="704" y="570" fill="#6b6491">scoring / docking / search</text>
  </g>

  <!-- Reports -->
  <g filter="url(#card)">
    <rect x="942" y="388" width="282" height="200" rx="18" fill="#ffffff" stroke="#e8e4f2" stroke-width="1.5"/>
  </g>
  <rect x="942" y="388" width="282" height="40" rx="18" fill="#ede9fe"/>
  <rect x="942" y="408" width="282" height="20" fill="#ede9fe"/>
  <text x="966" y="415" font-size="12" font-weight="700" fill="#6b1ea8" letter-spacing="0.8">REPORTS</text>
  <text x="966" y="458" font-size="16" font-weight="700" fill="#1a1535">Read-only HTML</text>
  <g font-size="13" font-weight="500" fill="#1a1535">
    <text x="966" y="486">• executive summary</text>
    <text x="966" y="510">• 3D viewer · plots · QC</text>
    <text x="966" y="534">• replay commands</text>
  </g>
  <g>
    <rect x="966" y="548" width="70" height="22" rx="6" fill="#e5f4fd" stroke="#a5dceb"/>
    <text x="1001" y="563" font-size="10" font-weight="700" fill="#0e7a93" text-anchor="middle">html</text>
    <rect x="1046" y="548" width="70" height="22" rx="6" fill="#fcebdd" stroke="#f8c98a"/>
    <text x="1081" y="563" font-size="10" font-weight="700" fill="#a3551b" text-anchor="middle">bundle</text>
  </g>

  <!-- arrows row 2 -->
  <path d="M354 488 H410" stroke="#6b1ea8" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M886 488 H942" stroke="#6b1ea8" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>

  <!-- workspace ↔ reports back-link -->
  <path d="M1092 318 V388" stroke="#a78bfa" stroke-width="2.4" stroke-dasharray="6 6" fill="none" marker-end="url(#arrowMuted)"/>

  <!-- workers ← workspace claim arrow (curve down from workspace bottom-left to workers top-right) -->
  <path d="M992 318 C 720 360 540 360 280 388" stroke="#a78bfa" stroke-width="2.4" stroke-dasharray="6 6" fill="none" marker-end="url(#arrowMuted)"/>

</svg>
